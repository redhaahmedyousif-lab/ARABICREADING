name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/nextjs-dashboard-setup-ubuydt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      # Without this, GitHub's Jekyll step drops the `_next/` asset folder.
      - run: touch out/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
